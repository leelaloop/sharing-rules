[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sharing-rules"
version = "0.1.0"
description = "Sharing rules for federated data that make 'who physically holds this record?' a queryable fact."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]

[tool.setuptools]
packages = ["sharing_rules"]
